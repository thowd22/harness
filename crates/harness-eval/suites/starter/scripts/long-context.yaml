# Good behaviour: read the end of the file and make one targeted edit.
responses:
  - content:
      - tool_use: { name: read, input: { path: data/settings.txt, offset: 5990, limit: 20 } }
  - content:
      - tool_use: { name: edit, input: { path: data/settings.txt, old_string: "answer=41", new_string: "answer=42" } }
  - content: [ { text: "Set answer=42 in data/settings.txt." } ]
