# implement (coder), then review (reviewer).
responses:
  - content:
      - tool_use: { name: read, input: { path: src/calc.sh } }
  - content:
      - tool_use:
          name: edit
          input:
            path: src/calc.sh
            old_string: "sub() { echo $(( $1 - $2 )); }"
            new_string: "sub() { echo $(( $1 - $2 )); }\ntriple() { echo $(( $1 * 3 )); }"
  - content: [ { text: "Added `triple` to src/calc.sh." } ]
  - content: [ { text: "The change is minimal and tested.\n```json\n{\"verdict\": \"approve\"}\n```" } ]
