# Dependabot version updates (security updates are enabled in the repo
# settings and run regardless of this file). Minor and patch bumps are
# grouped so each ecosystem opens at most one routine PR a week.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # dtolnay/rust-toolchain's tag *is* the Rust version CI installs, so a
    # bump would silently move CI off the compiler pinned in
    # rust-toolchain.toml. The toolchain is upgraded by hand instead: change
    # the channel in rust-toolchain.toml and every dtolnay/rust-toolchain@
    # tag together (crates/harness/tests/ci_workflow.rs checks they match).
    # See docs/ci.md, "Dependency updates".
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    commit-message:
      prefix: ci
