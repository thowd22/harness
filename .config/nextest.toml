# cargo-nextest settings (https://nexte.st). CI runs `--profile ci`.

[profile.ci]
# A test that runs longer than 60 s is reported as slow; after 5 periods
# (5 min) it is killed and fails, so a hang names itself instead of eating
# the job's timeout.
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false
failure-output = "immediate-final"
